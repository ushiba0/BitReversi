[package]
name = "trainer"
version = "0.1.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
once_cell = "1.15.0"
base64 = "0.13.0"
env_logger = "0.10.0"
log = "0.4.0"
rand = "0.8.5"
clap = { version = "4.6.1", features = ["derive"] }
bitreversi = { path = "../bitreversi/" }

[features]
debug = []

[profile.dev]
panic = 'abort'

[profile.release]
strip = true
opt-level = 3
#lto = true
#codegen-units = 1
panic = "abort"
